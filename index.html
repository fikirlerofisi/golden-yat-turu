<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0B1F3A"/>
  <title>Golden City Tours — Operasyon</title>
  <link rel="icon" href="Logo/GoldenCity.png"/>
  <link rel="stylesheet" href="css/styles.css?v=4"/>
  <!-- Önbellek kırma: her yayında aşağıdaki ve üstteki tüm v= numaralarını birlikte artırın -->
  <script type="importmap">
  {
    "imports": {
      "./js/app.js":      "./js/app.js?v=4",
      "./js/auth.js":     "./js/auth.js?v=4",
      "./js/tours.js":    "./js/tours.js?v=4",
      "./js/bookings.js": "./js/bookings.js?v=4",
      "./js/checkin.js":  "./js/checkin.js?v=4",
      "./js/realtime.js": "./js/realtime.js?v=4",
      "./js/config.js":   "./js/config.js?v=4",
      "./js/supabase.js": "./js/supabase.js?v=4"
    }
  }
  </script>
</head>
<body>

<!-- ═══════════ LOGIN ═══════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <img src="Logo/GoldenCity.png" alt="Golden City Tours" class="login-logo-img"/>
    </div>
    <hr class="login-div"/>
    <form id="login-form" novalidate>
      <div class="field-group">
        <label for="login-email">Kullanıcı Adı</label>
        <input id="login-email" type="text" autocomplete="username" placeholder="nursah" required/>
      </div>
      <div class="field-group">
        <label for="login-password">Şifre</label>
        <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••" required/>
      </div>
      <div id="login-error" role="alert"></div>
      <button type="submit">Giriş Yap</button>
    </form>
  </div>
</div>

<!-- ═══════════ UYGULAMA ═══════════ -->
<div id="app-screen" class="hidden">

  <!-- Topbar -->
  <header class="topbar">
    <div class="brand">
      <img src="Logo/GoldenCity.png" alt="Golden City Tours" class="topbar-logo"/>
    </div>
    <div class="top-right">
      <span id="user-name"></span>
      <button id="logout-btn">Çıkış</button>
    </div>
  </header>

  <!-- Kontrol şeridi -->
  <div class="ctrl-bar">
    <input id="date-input" type="date" aria-label="Tarih seç"/>
    <button id="new-tour-btn">New</button>
    <input class="search-box" id="search-box" type="search" placeholder="İsim veya telefon…" autocomplete="off"/>
    <button id="add-booking-btn" disabled>+ Rezervasyon Ekle</button>
    <button id="crews-btn" disabled>⚓ Ekipler</button>
  </div>

  <!-- İstatistik çubuğu -->
  <div id="stats-bar"></div>

  <!-- Seçim aksiyon çubuğu (seçim olunca görünür) -->
  <div class="sel-bar hidden" id="sel-bar">
    <div class="sel-plus">+</div>
    <span class="sel-count" id="sel-count">0 seçildi</span>
    <span class="sel-sep">|</span>
    <div class="sel-field">
      <label>Yacht</label>
      <select id="sel-yacht">
        <option value="">— Seçin —</option>
        <option>River</option><option>River Mega</option><option>River Storm</option>
      </select>
    </div>
    <div class="sel-field" id="sel-guide-field">
      <label>Tour Guide</label>
      <select id="sel-guide">
        <option value="">— Seçin —</option>
        <option>Erdem</option><option>Doğacan</option><option>Taner</option><option>Muhsin</option>
        <option>Erol</option><option>Özge</option><option>Bülent</option><option>Tülay</option>
        <option>Diyar</option><option>Şeyma</option><option>Celal</option><option>Özgür</option>
        <option>Volkan</option><option>Sendi</option><option>Işıl</option>
      </select>
    </div>
    <div class="sel-field" id="sel-staff-field">
      <label>Crew</label>
      <select id="sel-staff">
        <option value="">— Seçin —</option>
        <option>Betül</option><option>Nurşah</option><option>Aleyna</option>
      </select>
    </div>
    <!-- Mevcut ekip kilitli iken gösterilir -->
    <span class="sel-crew-locked hidden" id="sel-crew-locked"></span>
    <button class="btn-sel-apply" id="btn-sel-apply" disabled>Uygula</button>
    <button class="btn-sel-clear" id="btn-sel-clear">Temizle</button>
  </div>

  <!-- Tablo (scroll kapsayıcısı içinde) -->
  <div class="table-scroll">
    <table class="main-table">
      <thead>
        <tr>
          <th class="col-chk">Check</th>
          <th>Tour</th>
          <th class="col-name">Name</th>
          <th>Pax</th>
          <th>Source</th>
          <th class="col-yacht">Yacht</th>
          <th>Phone</th>
          <th>Payment</th>
          <th>Transfer</th>
          <th>Tour Guide</th>
          <th>Crew</th>
          <th>Remarks</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr class="empty-row"><td colspan="13">Tarih seçin ve tur oluşturun.</td></tr>
      </tbody>
      <tfoot id="tfoot"></tfoot>
    </table>
  </div>

</div><!-- /app-screen -->

<!-- ═══════════ REZERVASYON MODAL ═══════════ -->
<div id="booking-modal" class="modal-overlay hidden"
     role="dialog" aria-modal="true" aria-labelledby="modal-title"
     onclick="if(event.target===this)document.getElementById('booking-modal').classList.add('hidden')">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modal-title">Yeni Rezervasyon</h2>
      <button class="modal-x" id="modal-close" aria-label="Kapat">✕</button>
    </div>
    <form id="booking-form" novalidate>
    <div class="modal-body">

      <div class="frow">
        <div class="fg">
          <label>Tur</label>
          <select id="f-tour" name="tour_code">
            <option>T1</option><option>TA</option><option>TB</option><option>TD</option><option>TN</option><option>PRV</option>
          </select>
        </div>
        <div class="fg">
          <label>Pax</label>
          <input name="pax" type="number" min="1" max="99" value="1"/>
        </div>
      </div>

      <div class="fg">
        <label>İsim / Ad Soyad *</label>
        <input name="name" type="text" placeholder="Ad Soyad" required autocomplete="off"/>
      </div>

      <div class="fg">
        <label>Telefon</label>
        <input name="phone" type="tel" placeholder="+90 5xx xxx xx xx"/>
      </div>

      <div class="frow">
        <div class="fg">
          <label>Kaynak</label>
          <select id="f-source" name="source"></select>
        </div>
        <div class="fg">
          <label>Ödeme</label>
          <select id="f-payment" name="payment"></select>
        </div>
      </div>

      <div class="frow">
        <div class="fg">
          <label>Not / Remarks</label>
          <input name="remarks" type="text" placeholder="Night, VIP, vb."/>
        </div>
        <div class="fg">
          <label>Bebek</label>
          <input name="baby" type="number" min="0" max="20" value="0"/>
        </div>
      </div>

      <label class="chk-label">
        <input type="checkbox" name="transfer"/>
        <span>Transfer var</span>
      </label>

    </div><!-- /modal-body -->
    <div class="modal-foot">
      <button type="button" class="btn-cancel" id="modal-cancel">Vazgeç</button>
      <button type="submit" class="btn-save">Kaydet</button>
    </div>
    </form>
  </div>
</div>

<!-- ═══════════ SEÇENEK YÖNETİMİ MODALI (New) ═══════════ -->
<div id="new-tour-modal" class="modal-overlay hidden"
     role="dialog" aria-modal="true"
     onclick="if(event.target===this)closeOptModal()">
  <div class="modal-box" style="max-width:400px">
    <div class="modal-head">
      <h2 id="opt-modal-title">Ne eklemek istiyorsunuz?</h2>
      <button class="modal-x" id="new-tour-close">✕</button>
    </div>
    <div class="modal-body">

      <!-- Adım 1: Kategori seçimi -->
      <div id="opt-step1">
        <div class="opt-cat-grid">
          <button class="opt-cat-btn" data-cat="yacht">⛵ Yacht</button>
          <button class="opt-cat-btn" data-cat="tour_guide">🧭 Tour Guide</button>
          <button class="opt-cat-btn" data-cat="tour_code">📋 Tour</button>
        </div>
      </div>

      <!-- Adım 2: Liste + ekleme -->
      <div id="opt-step2" class="hidden">
        <div id="opt-chips-wrap">
          <!-- mevcut seçenekler JS ile doldurulur -->
        </div>
        <div class="opt-add-row">
          <input type="text" id="opt-new-val" placeholder="Yeni değer girin…" autocomplete="off"/>
          <button class="btn-save" id="opt-add-btn">+ Ekle</button>
        </div>
        <button class="opt-back-btn" id="opt-back-btn">← Geri</button>
      </div>

    </div>
  </div>
</div>

<!-- ═══════════ EKİPLER MODALI ═══════════ -->
<div id="crews-modal" class="modal-overlay hidden"
     role="dialog" aria-modal="true"
     onclick="if(event.target===this)document.getElementById('crews-modal').classList.add('hidden')">
  <div class="modal-box" style="max-width:440px">
    <div class="modal-head">
      <h2>⚓ Yat Ekipleri</h2>
      <button class="modal-x" id="crews-close">✕</button>
    </div>
    <div class="modal-body" id="crews-body">
      <!-- JS ile doldurulur -->
    </div>
    <div class="modal-foot">
      <button type="button" class="btn-cancel" id="crews-cancel">Kapat</button>
    </div>
  </div>
</div>

<script type="module" src="js/app.js?v=4"></script>
</body>
</html>
